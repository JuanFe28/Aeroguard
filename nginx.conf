server {
    listen 80;
    server_name localhost;

    # Compresión gzip
    gzip on;
    gzip_static on;   # Usa los .gz pre-generados en la etapa "assets" del Dockerfile
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Raíz del Frontend Vanilla JS
    root /usr/share/nginx/html;
    index index.html;

    # Encabezados de Seguridad (OWASP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://*.cartocdn.com https://unpkg.com https://*.googleapis.com https://*.gstatic.com; connect-src 'self' ws: wss: http: https:;" always;

    # Rutas del SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el API de FastAPI
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para WebSockets en tiempo real (RF-016)
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check endpoint
    location = /metrics {
        proxy_pass http://backend:8000/metrics;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }
}
