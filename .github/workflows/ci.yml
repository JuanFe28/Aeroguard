name: Verificación académica
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_prepare_monitoring.py -v
      - run: python -m unittest discover -s tests -p test_app_qa_report.py -v
      - run: python scripts/prepare_deploy.py --directory tmp/handoff --project aeroguard-ci
      - run: python scripts/prepare_monitoring.py --env-file tmp/handoff/.env --directory deploy
      - name: Validar Compose combinado sin mostrar secretos
        env:
          AEROGUARD_QA_TAG: ci
          AEROGUARD_QA_EVIDENCE: /tmp/aeroguard-browser-evidence
        run: |
          docker compose --env-file tmp/handoff/.env --env-file deploy/.env.monitoring -f deploy/compose.yml -f deploy/compose.monitoring.yml config --quiet
          docker compose --env-file tmp/handoff/.env -f deploy/compose.yml -f deploy/compose.source-qa.yml config --quiet
          docker compose --env-file tmp/handoff/.env -f deploy/compose.yml -f deploy/compose.source-qa.yml -f deploy/compose.browser-qa.yml --profile qa-ui config --quiet
  app-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -c constraints.txt -r backend/requirements-expo.txt
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Ensayar navegador en base SQLite temporal
        run: python scripts/run_local_app_qa.py
      # Informes detallados quedan privados en el runner: pueden contener credenciales
      # sintéticas en errores. El servidor guardará la evidencia en backups/ (ignorado).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade setuptools==84.1.0
      - run: python -m pip install -c constraints.txt -r backend/requirements-expo.txt pip-audit==2.9.0
      # La auditoría de dependencias bloquea si hay avisos; no se silencian.
      - run: python scripts/release_checks.py --output tmp/ci-evidence --audit-dependencies
      - run: node --test tests/frontend_qa.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academic-checks
          path: tmp/ci-evidence
  containers:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - name: ai-service
            context: ai_service
            dockerfile: ai_service/Dockerfile
          - name: simulator
            context: sensor_simulator
            dockerfile: sensor_simulator/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Pruebas en imagen backend
        if: matrix.name == 'backend'
        run: docker build --target test -f backend/Dockerfile .
      - name: Construir candidata sin publicar
        run: docker build --target runtime -f '${{ matrix.dockerfile }}' -t 'aeroguard/${{ matrix.name }}:candidate' '${{ matrix.context }}'
      - name: Guardar artefacto local
        run: docker save 'aeroguard/${{ matrix.name }}:candidate' -o '${{ matrix.name }}.tar'
      - uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.name }}
          path: '${{ matrix.name }}.tar'
