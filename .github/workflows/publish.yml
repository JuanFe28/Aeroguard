name: Publicar candidata en GHCR (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión aprobada, por ejemplo 1.2.0-rc.1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -c constraints.txt -r backend/requirements-expo.txt pip-audit==2.9.0
      - run: python scripts/release_checks.py --output tmp/publish-checks --audit-dependencies
  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - name: ai-service
            context: ai_service
            dockerfile: ai_service/Dockerfile
          - name: simulator
            context: sensor_simulator
            dockerfile: sensor_simulator/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Validar versión y determinar nombre
        id: image
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.name }}
        run: |
          [[ "$VERSION" =~ ^1\.2\.0(-rc\.[1-9][0-9]*)?$ ]] || exit 1
          echo "tag=ghcr.io/${OWNER,,}/aeroguard-${COMPONENT}:${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Probar backend en Linux
        if: matrix.name == 'backend'
        run: docker build --target test -f backend/Dockerfile .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.tag }}
      - name: Registrar digest publicado
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" > digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digest.txt
