name: Release de AeroGuard en GHCR
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión aprobada, por ejemplo 1.2.0-rc.1'
        required: true
        default: '1.2.0-rc.1'
        type: string
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade setuptools==84.1.0
      - run: python -m pip install -c constraints.txt -r backend/requirements-expo.txt pip-audit==2.9.0
      - run: python scripts/release_checks.py --output tmp/publish-checks --audit-dependencies
      - name: Probar endpoint independiente de análisis
        run: python -m unittest discover -s tests -p test_ai_http.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-quality
          path: tmp/publish-checks
  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - name: ai-service
            context: ai_service
            dockerfile: ai_service/Dockerfile
          - name: simulator
            context: sensor_simulator
            dockerfile: sensor_simulator/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validar versión y determinar nombre
        id: image
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.name }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] || exit 1
          python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert v == os.environ["VERSION"].replace("-rc.","rc"), "La versión no coincide con pyproject.toml"'
          echo "tag=ghcr.io/${OWNER,,}/aeroguard-${COMPONENT}:${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Probar backend en Linux
        if: matrix.name == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: test
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Registrar digest publicado
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "$IMAGE@$DIGEST" > digest.txt
          docker buildx imagetools inspect "$IMAGE" > image-inspect.txt
          cat image-inspect.txt
          echo "### Imagen publicada y comprobada" >> "$GITHUB_STEP_SUMMARY"
          echo "Usuario que ejecutó la publicación: $GITHUB_ACTOR" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Comprobar endpoint del microservicio
        if: matrix.name == 'backend' || matrix.name == 'ai-service'
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          COMPONENT: ${{ matrix.name }}
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          if [ "$COMPONENT" = backend ]; then
            PORT=18000
            docker run -d --name release-smoke -e APP_ENV=development -e DEBUG=false -e SECRET_KEY="$TOKEN" -e DATABASE_URL=sqlite+aiosqlite:////tmp/release.db -e REPORT_SCHEDULER_ENABLED=false -p 127.0.0.1:$PORT:8000 "$IMAGE"
          else
            PORT=18001
            docker run -d --name release-smoke -e AI_SERVICE_TOKEN="$TOKEN" -p 127.0.0.1:$PORT:8001 "$IMAGE" python -m ai_service.http_api
          fi
          trap 'docker logs release-smoke; docker rm -f release-smoke' EXIT
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:$PORT/health" -o endpoint-health.json; then break; fi
            sleep 1
          done
          test -s endpoint-health.json
          cat endpoint-health.json
          if [ "$COMPONENT" = ai-service ]; then
            curl -fsS -H "Authorization: Bearer $TOKEN" --data-binary @docs/assets/drone_demo.jpg "http://127.0.0.1:$PORT/analyze" -o endpoint-analyze.json
            cat endpoint-analyze.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: |
            digest.txt
            image-inspect.txt
            endpoint-*.json
