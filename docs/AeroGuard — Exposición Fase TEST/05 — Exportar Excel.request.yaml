$kind: http-request
url: "{{base_url}}/api/v1/reports/export/excel?type=detections"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Archivo Excel XLSX', function () { pm.expect(pm.response.headers.get('Content-Type')).to.include('spreadsheetml.sheet'); pm.expect(pm.response.headers.get('Content-Disposition')).to.include('.xlsx'); });
    language: text/javascript
order: 5000
