$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/config"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: json
    content: |-
      {
        "detection_max_altitude": 1613.708114481076,
        "detection_min_speed": 7907.9796062018595,
        "detection_max_speed": 3610.429464650098,
        "ai_confidence_threshold": 1359.7892064941009,
        "ai_enabled": false,
        "anomaly_threshold": 3348.432770391542,
        "alerts_enabled": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
