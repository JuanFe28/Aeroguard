$kind: http-request
description: Renueva el access token usando el refresh token.
url: "{{baseUrl}}/api/v1/auth/refresh"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "refresh_token": "string"
    }
  $type: |-
    {
      "title": "RefreshRequest",
      "type": "object",
      "properties": {
        "refresh_token": {
          "type": "string",
          "title": "Refresh Token"
        }
      },
      "required": [
        "refresh_token"
      ]
    }
settings: {}
examples: ./.resources/Renovar Access Token.resources/examples
order: 1000
