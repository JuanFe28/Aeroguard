$kind: http-request
name: "RF-003: Resetear Contraseña"
description: Aplica la nueva contraseña usando el token de recuperación.
url: "{{baseUrl}}/api/v1/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "token": "string",
      "new_password": "string"
    }
  $type: |-
    {
      "title": "PasswordResetConfirm",
      "type": "object",
      "properties": {
        "token": {
          "type": "string",
          "title": "Token"
        },
        "new_password": {
          "type": "string",
          "title": "New Password"
        }
      },
      "required": [
        "token",
        "new_password"
      ]
    }
settings: {}
examples: ./.resources/RF-003- Resetear Contraseña.resources/examples
order: 1000
