$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/change-password"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: json
    content: |-
      {
        "current_password": "string",
        "new_password": "string"
      }
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000
