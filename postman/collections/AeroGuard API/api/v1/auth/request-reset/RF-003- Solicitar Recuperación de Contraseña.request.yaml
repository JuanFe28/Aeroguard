$kind: http-request
name: "RF-003: Solicitar Recuperación de Contraseña"
description: |-
  Envía un correo de recuperación de contraseña.
  Siempre retorna 202 para no revelar si el correo existe (OWASP A07).
url: "{{baseUrl}}/api/v1/auth/request-reset"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "D10cY@bhKgtMKEMRMdjckkbDha.arvz"
    }
  $type: |-
    {
      "title": "PasswordResetRequest",
      "type": "object",
      "properties": {
        "email": {
          "type": "string",
          "title": "Email",
          "format": "email"
        }
      },
      "required": [
        "email"
      ]
    }
settings: {}
examples: ./.resources/RF-003- Solicitar Recuperación de Contraseña.resources/examples
order: 1000
