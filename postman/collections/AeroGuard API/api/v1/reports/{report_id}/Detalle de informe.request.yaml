$kind: http-request
description: Obtiene el estado o enlace de descarga de un reporte.
url: "{{baseUrl}}/api/v1/reports/:report_id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: report_id
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "title": "Report Id",
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /api/v1/auth/token
    grant_type: password_credentials
settings: {}
examples: ./.resources/Detalle de informe.resources/examples
order: 2000
