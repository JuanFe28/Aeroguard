$kind: http-request
name: Descargar reporte táctico en PDF con SHA-256 (HU-02 / Escenario 3)
description: |-
  Genera físicamente un documento PDF binario compilado con ReportLab.
  Incluye:
  - Membrete institucional UTS.
  - Resumen ejecutivo de KPIs.
  - Dictamen de Inteligencia Artificial táctico.
  - Tabla detallada de telemetría e incursiones en zonas protegidas.
  - Firma criptográfica SHA-256 al pie para cadena de custodia.
url: "{{baseUrl}}/api/v1/reports/export/pdf?type=detections&date_from=string&date_to=string"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: type
    value: detections
    disabled: false
    description: "Tipo de reporte: detections, alerts, summary"
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Tipo de reporte: detections, alerts, summary",
            "title": "Type",
            "type": "string",
            "default": "detections"
          }
        }
      }
  - key: date_from
    value: string
    disabled: false
    description: ""
    $type: string
  - key: date_to
    value: string
    disabled: false
    description: ""
    $type: string
body:
  type: text
  content: ""
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /api/v1/auth/token
    grant_type: password_credentials
settings: {}
examples: ./.resources/Descargar reporte táctico en PDF con SHA-256 (HU-02 - Escenario.resources/examples
order: 1000
