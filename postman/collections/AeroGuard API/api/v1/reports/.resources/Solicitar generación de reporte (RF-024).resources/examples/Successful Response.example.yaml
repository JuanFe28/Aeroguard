$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/reports"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: json
    content: |-
      {
        "title": "string",
        "type": "detections",
        "format": "csv",
        "date_from": "1969-05-08T06:06:31.190Z",
        "date_to": null,
        "params": {}
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
