        "latitude": {
          "type": "number",
          "title": "Latitude"
        },
        "longitude": {
          "type": "number",
          "title": "Longitude"
        },
        "altitude": {
          "type": "number",
          "title": "Altitude"
        },
        "speed": {
          "type": "number",
          "title": "Speed"
        },
        "heading": {
          "type": "number",
          "title": "Heading"
        },
        "threat_level": {
          "type": "string",
          "enum": [
            "low",
            "medium",
            "high",
            "critical"
          ],
          "title": "ThreatLevel"
