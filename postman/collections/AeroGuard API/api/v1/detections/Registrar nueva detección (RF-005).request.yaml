$kind: http-request
description: Crea un nuevo registro de detección y su primer punto de trayectoria.
url: "{{baseUrl}}/api/v1/detections"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "latitude": 1983.3020229868525,
