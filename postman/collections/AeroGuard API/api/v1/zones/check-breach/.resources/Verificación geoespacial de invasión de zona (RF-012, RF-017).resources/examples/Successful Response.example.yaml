$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/zones/check-breach"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: json
    content: |-
      {
        "latitude": 61.91357477035393,
        "longitude": -132.68591091993082,
        "altitude": 0,
        "zone_id": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
