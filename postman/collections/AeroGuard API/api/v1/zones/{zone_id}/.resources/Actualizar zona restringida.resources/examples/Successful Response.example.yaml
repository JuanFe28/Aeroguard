$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/zones/:zone_id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    zone_id: string
  body:
    type: json
    content: |-
      {
        "name": null,
        "description": "string",
        "threat_level": "high",
        "severity": null,
        "color": "string",
        "max_altitude": 6728.393943437827,
        "min_altitude": null,
        "coordinates": [
          "",
          ""
        ],
        "polygon": null,
        "is_active": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
