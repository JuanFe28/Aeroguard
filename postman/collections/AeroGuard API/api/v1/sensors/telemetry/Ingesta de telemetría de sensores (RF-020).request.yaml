$kind: http-request
description: |-
  Procesa telemetría proveniente de sensores físicos o simuladores.
  - Valida rangos para descartar ruido o lecturas inválidas (RF-029).
  - Crea o actualiza detección activa con punto de trayectoria.
  - Evalúa proximidad a zonas restringidas para disparo de alertas (RF-012).
  - Emite evento en tiempo real vía WebSockets.
url: "{{baseUrl}}/api/v1/sensors/telemetry"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "sensor_id": "string",
      "latitude": 1561.0709214576857,
      "longitude": 9584.270584395395,
      "altitude": 9251.557694965659,
      "speed": 3581.0833262549936,
      "heading": 3718.020276240358,
      "timestamp": "string",
      "signal_strength": null
    }
  $type: |-
    {
      "title": "TelemetryPacketSchema",
      "type": "object",
      "properties": {
        "sensor_id": {
          "type": "string",
          "title": "Sensor Id"
        },
        "latitude": {
          "type": "number",
          "title": "Latitude"
        },
        "longitude": {
          "type": "number",
          "title": "Longitude"
        },
        "altitude": {
          "type": "number",
          "title": "Altitude"
        },
        "speed": {
          "type": "number",
          "title": "Speed"
        },
        "heading": {
          "type": "number",
          "title": "Heading"
        },
        "timestamp": {
          "title": "Timestamp",
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        },
        "signal_strength": {
          "title": "Signal Strength",
          "anyOf": [
            {
              "type": "number"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "sensor_id",
        "latitude",
        "longitude",
        "altitude",
        "speed",
        "heading"
      ]
    }
settings: {}
examples: ./.resources/Ingesta de telemetría de sensores (RF-020).resources/examples
order: 1000
