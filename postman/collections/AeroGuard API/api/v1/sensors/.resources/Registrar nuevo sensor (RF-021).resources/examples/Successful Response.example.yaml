$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/sensors"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "latitude": 8677.534607559226,
        "longitude": 6381.619514172672,
        "type": "optical",
        "status": "calibrating",
        "altitude": 0,
        "range_km": 5,
        "config": {}
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
