$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/sensors/:sensor_id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    sensor_id: string
  body:
    type: json
    content: |-
      {
        "name": null,
        "type": null,
        "status": "maintenance",
        "latitude": 8475.620238449967,
        "longitude": null,
        "altitude": 3599.383965966625,
        "range_km": 765.2931938208308,
        "config": null
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": [
          {
            "loc": [
              5077,
              "string"
            ],
            "msg": "string",
            "type": "string"
          },
          {
            "loc": [
              "string",
              4973
            ],
            "msg": "string",
            "type": "string"
          }
        ]
      }
    $type: |-
      {
        "title": "HTTPValidationError",
        "type": "object",
        "properties": {
          "detail": {
            "type": "array",
            "title": "Detail",
            "items": {
              "title": "ValidationError",
              "type": "object",
              "properties": {
                "loc": {
                  "type": "array",
                  "title": "Location",
                  "items": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "integer"
                      }
                    ]
                  }
                },
                "msg": {
                  "type": "string",
                  "title": "Message"
                },
                "type": {
                  "type": "string",
                  "title": "Error Type"
                }
              },
              "required": [
                "loc",
                "msg",
                "type"
              ]
            }
          }
        }
      }
order: 2000
