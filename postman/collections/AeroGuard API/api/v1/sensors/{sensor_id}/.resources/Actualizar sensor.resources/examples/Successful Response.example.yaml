$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/sensors/:sensor_id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    sensor_id: string
  body:
    type: json
    content: |-
      {
        "name": null,
        "type": null,
        "status": "maintenance",
        "latitude": 8475.620238449967,
        "longitude": null,
        "altitude": 3599.383965966625,
        "range_km": 765.2931938208308,
        "config": null
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
