$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/alerts"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: json
    content: |-
      {
        "title": "string",
        "message": "string",
        "detection_id": null,
        "type": "anomalous_behavior",
        "severity": "medium"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
